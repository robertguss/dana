name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (defaults to github.ref_name)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: x86_64-linux
          - os: macos-latest
            target_name: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libsqlite3-dev libzstd-dev zlib1g-dev

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl@3 zstd
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/zstd/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary and run smoke test
        run: |
          cargo build --release --bin dana
          ./target/release/dana --version
          ./target/release/dana test examples/expenses.dana

      - name: Package release archive
        env:
          INPUT_TAG: ${{ inputs.tag }}
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          RAW_TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          PKG_DIR="dana-${RAW_TAG}-${TARGET_NAME}"
          mkdir -p "$PKG_DIR"
          cp target/release/dana README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"
          tar -czf "${PKG_DIR}.tar.gz" "$PKG_DIR"
          echo "ASSET_FILE=${PKG_DIR}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dana-${{ matrix.target_name }}
          path: ${{ env.ASSET_FILE }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum dana-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dana-*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
