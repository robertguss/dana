[package]
name = "dana"
version = "0.6.7"
edition = "2024"
description = "Dana v0.6 (pre-1.0) — zero-crate AI-first data language compiler, vectorized columnar VM, streaming columnar CSV/Parquet I/O, SQL pushdown, privacy checker, and differential oracle"
license = "MIT OR Apache-2.0"

# Non-Negotiable Engineering Rule 1: Zero external Rust crates.
[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
or_fun_call = "deny"
undocumented_unsafe_blocks = "deny"
